[package]
name = "candle-core-fathomdb"
version = "0.13.0"
edition.workspace = true
description = "FathomDB fork of Candle's core crate, built on cudarc-fathomdb; not the upstream crate. See FATHOMDB.md in the repository."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[lib]
name = "candle_core"

[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
candle-kernels = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
cutile = { workspace = true, optional = true }
half = { workspace = true, features = ["zerocopy"] }
float8 = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
libc = { workspace = true }
libm = { workspace = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
yoke = { workspace = true }
zerocopy = { workspace = true }
zip = { workspace = true }
parking_lot = "0.12.5"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["fancy-regex"] }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
# Gemm's F16 backend emits `fullfp16` instructions unavailable on the Tier-1
# Linux AArch64 baseline. CPU F16 matmul returns Candle's unsupported-dtype
# error on this target; FathomDB's shipped models use F32.
gemm = { version = "0.19.0", default-features = false, features = ["std", "rayon", "wasm-simd128-enable"] }

[target.'cfg(not(all(target_arch = "aarch64", target_os = "linux")))'.dependencies]
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels"]
cutile = ["cuda", "dep:cutile"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = [
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:candle-metal-kernels",
]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]

[[example]]
name = "cutile"
required-features = ["cutile"]
